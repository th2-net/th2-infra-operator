[versions]
kotlin = "2.4.10"
th2-plugin = "0.3.14"
jupiter = "5.14.3"
detekt = "1.23.8"
strikt = "0.34.1"

# --- Security fixes (see build/reports/dependency-check-report.html) ---
amqp-client = "5.34.0"
jackson-bom = "2.22.2"
log4j-bom = "2.26.1"
netty-bom = "4.2.18.Final"
vertx = "4.5.31"

[libraries]
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging", version = "7.0.14" }
kubernetes-client = { group = "io.fabric8", name = "kubernetes-client", version = "7.5.2" }
http-client = { group = "com.rabbitmq", name = "http-client", version = "5.4.0" }
java-uuid-generator = { group = "com.fasterxml.uuid", name = "java-uuid-generator", version = "5.2.0" }

# --- Security fixes ---
amqp-client = { group = "com.rabbitmq", name = "amqp-client", version.ref = "amqp-client" }
jackson-bom = { group = "com.fasterxml.jackson", name = "jackson-bom", version.ref = "jackson-bom" }
log4j-bom = { group = "org.apache.logging.log4j", name = "log4j-bom", version.ref = "log4j-bom" }
netty-bom = { group = "io.netty", name = "netty-bom", version.ref = "netty-bom" }
vertx-core = { group = "io.vertx", name = "vertx-core", version.ref = "vertx" }
vertx-auth-common = { group = "io.vertx", name = "vertx-auth-common", version.ref = "vertx" }
vertx-web-client = { group = "io.vertx", name = "vertx-web-client", version.ref = "vertx" }
vertx-web-common = { group = "io.vertx", name = "vertx-web-common", version.ref = "vertx" }

mockito-core = { group = "org.mockito", name = "mockito-core", version = "5.21.0" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version = "6.2.3" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "jupiter" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "jupiter" }

strikt-core = { group = "io.strikt", name = "strikt-core", version.ref = "strikt" }
testcontainers-bom = { group = "org.testcontainers", name = "testcontainers-bom", version = "2.0.3" }
awaitility = { group = "org.awaitility", name = "awaitility", version = "4.3.0" }

detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
download = { id = "de.undercouch.download", version = "5.7.0" }

th2-component = { id = "com.exactpro.th2.gradle.component", version.ref = "th2-plugin" }